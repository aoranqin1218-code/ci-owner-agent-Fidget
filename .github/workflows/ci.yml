name: CI Tests

run-name: CI Tests - ${{ github.ref_name }} - @${{ github.actor }}

on:
  # 推送到 main 时运行
  push:
    branches:
      - main

  # 向 main 提交 PR 时运行
  pull_request:
    branches:
      - main

  # 允许在网页上手动点击 Run workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q