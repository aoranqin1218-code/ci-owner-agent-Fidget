[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-owner-agent"
version = "0.1.0"
description = "CI test failure responsibility agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "requests>=2,<3",
  "langchain>=1.3,<2",
  "langchain-core>=1.4.7,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.2,<2",
  "langsmith>=0.9,<1",
  "pymongo>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
llm = [
  "langchain>=1.3,<2",
  "langchain-core>=1.4.7,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.2,<2",
  "langsmith>=0.9,<1",
]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["ci_owner_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
