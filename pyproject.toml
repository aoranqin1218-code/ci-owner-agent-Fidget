[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-owner-agent"
version = "0.1.0"
description = "CI test failure responsibility agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
llm = [
  "langchain",
  "langchain-openai",
]

[tool.setuptools.packages.find]
include = ["ci_owner_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
